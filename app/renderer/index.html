<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>回响 · 微信接待助手</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="desktop.css" />
  </head>
  <body>
    <div id="app">
      <div class="e-windowbar">
        <span>回响 · AI 接待助手</span><span id="app-version">本地预览版</span>
      </div>
      <div class="e-shell">
        <aside class="e-sidebar">
          <nav class="e-navigation" aria-label="主导航">
            <button class="e-nav e-active" data-page="inbox">
              <span data-icon="chat"></span><span>助手</span>
            </button>
            <button class="e-nav" data-page="knowledge">
              <span data-icon="book"></span><span>资料</span>
            </button>
            <button class="e-nav" data-page="rules">
              <span data-icon="sliders"></span><span>设置</span>
            </button>
            <button class="e-nav" data-page="channels">
              <span data-icon="windows"></span><span>连接</span>
            </button>
            <button class="e-nav" data-page="logs">
              <span data-icon="clock"></span><span>记录</span>
            </button>
          </nav>
        </aside>
        <main class="e-main">
          <header class="e-topbar">
            <div class="e-breadcrumb">
              我的工作空间 <span>/</span
              ><strong id="page-title">接待工作台</strong>
            </div>
            <div class="e-top-actions">
              <span class="e-run-status" id="run-status">尚未开始接待</span
              ><button
                class="e-button e-small"
                id="run-button"
                data-action="toggle-run"
              >
                开始接待
              </button>
            </div>
          </header>
          <div id="demo-banner" class="demo-banner" hidden>
            正在查看示例，所有操作仅作演示。<button data-action="exit-demo">
              退出演示
            </button>
          </div>
          <div id="content"><div class="e-empty">正在打开工作空间…</div></div>
          <footer class="e-footer">
            <span
              ><span class="e-dot"></span
              ><span id="footer-state" role="status">正在加载…</span></span
            ><span>HUIXIANG / 0.1</span>
          </footer>
        </main>
      </div>
      <div class="e-notice" id="notice" role="status" hidden></div>
      <div class="e-overlay" id="overlay" hidden>
        <section
          class="e-modal"
          role="dialog"
          aria-modal="true"
          aria-labelledby="modal-title"
        >
          <div class="e-sectionhead">
            <h3 id="modal-title"></h3>
            <button
              class="e-iconbutton"
              data-action="close-modal"
              aria-label="关闭"
              data-icon="close"
            ></button>
          </div>
          <div id="modal-content"></div>
        </section>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
